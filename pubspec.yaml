name: deliveryflow
description: DeliveryFlow - weekly schedules, order tracking, working hours and reports for delivery drivers.
publish_to: 'none'
version: 25.0.1+30

environment:
  sdk: ^3.6.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  intl: ^0.20.2
  path_provider: ^2.1.4
  share_plus: ^13.3.1
  geolocator: ^13.0.1
  flutter_foreground_task: ^8.13.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  http: ^1.2.2
  file_picker: ^13.1.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_map_tile_caching: ^9.0.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23

# v22: objectbox_flutter_libs is vendored under plugins/ (same pattern as
# Study Assistant's vendored flutter_tesseract_ocr). The stock 2.5.1
# hardcodes compileSdkVersion 31 in android/build.gradle, which fails
# :objectbox_flutter_libs:checkReleaseAarMetadata on AGP 9 because its
# transitive androidx deps require 34+. The vendored copy is identical
# except compileSdkVersion 34 (see the comment in its build.gradle).
dependency_overrides:
  objectbox_flutter_libs:
    path: plugins/objectbox_flutter_libs
