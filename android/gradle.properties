org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# v22: objectbox_flutter_libs (FMTC v9's tile-storage backend) is a
# third-party plugin that hardcodes compileSdkVersion 31, while its
# transitive androidx deps (fragment 1.7.1, window 1.2.0, pulled in via
# the Flutter embedding) declare minCompileSdk 34. The plugin itself is
# only a native-library loader and touches none of those APIs, and the
# app module compiles against the Flutter SDK's compileSdk (35+) anyway,
# so this officially-supported AGP escape hatch only silences that
# third-party metadata mismatch. minSdk/targetSdk are untouched.
android.suppressUnsupportedCompileSdk=34
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
