name: Build DeliveryFlow APK

# Builds a release APK in the cloud on every push to main
# and on manual trigger. The APK is published to the "latest"
# GitHub Release for easy download.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore binary files (stored as base64 text)
        run: |
          for f in \
            android/gradle/wrapper/gradle-wrapper.jar \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ; do
            base64 -d "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          file android/gradle/wrapper/gradle-wrapper.jar

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.7 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deliveryflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # v27.37: the in-app updater reads this manifest — it MUST be
      # regenerated on EVERY release, or the updater goes blind.
      # No manual step: versionCode/versionName come from pubspec,
      # the changelog is the release commit's subject, the SHA-256
      # and size are measured from the APK just built, and the APK
      # URL is the STABLE "latest" release asset (never an expiring
      # fast link). The manifest is published as a release asset
      # alongside the APK in the step below, so the app's stable
      # manifest URL always resolves to the newest release.
      - name: Generate version manifest (version.json)
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, re, subprocess
          pubspec = open('pubspec.yaml').read()
          m = re.search(r'^version:\s*([0-9.]+)\+(\d+)', pubspec, re.M)
          assert m, 'pubspec version not in X.Y.Z+N form'
          version_name, version_code = m.group(1), int(m.group(2))
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          data = open(apk, 'rb').read()
          changelog = subprocess.check_output(
              ['git', 'log', '-1', '--pretty=%s']).decode().strip()
          manifest = {
              'versionCode': version_code,
              'versionName': version_name,
              'changelog': changelog,
              'apkUrl': 'https://github.com/mohamed5946/deliveryflow/releases/download/latest/app-release.apk',
              'apkSha256': hashlib.sha256(data).hexdigest(),
              'apkSizeBytes': len(data),
          }
          with open('version.json', 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          print(json.dumps(manifest, indent=2))
          PYEOF

      - name: Publish APK + version manifest to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "DeliveryFlow APK (latest)"
          body: "Latest successful release build of the DeliveryFlow app."
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            version.json
